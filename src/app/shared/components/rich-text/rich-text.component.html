<div class="rich-text-container">
  <quill-editor 
    class="quill-editor"
    [ngModel]="value"
    (ngModelChange)="onContentChange($event)"
    [modules]="quillModules"
    [placeholder]="placeholder"
    [style.height]="height"
    [readOnly]="isDisabled"
    format="html">
  </quill-editor>
</div>
